
name: Notify master repo on push

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository dispatch to RD-master
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.MASTER_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/charlyknz/RD-master/dispatches \
            -d '{"event_type": "update_submodule"}'

